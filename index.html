<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Puzzle Starter</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="app">

    <!-- TITLE -->
    <section id="screen-title" class="screen active">
      <h1 id="game-title">Puzzle Starter</h1>
      <p class="tagline">One-line pitch goes here.</p>
      <div class="stack">
        <button id="btn-play">Play</button>
        <button id="btn-levels">Levels</button>
        <button id="btn-how">How to play</button>
        <button id="btn-mute" aria-pressed="false">Sound: on</button>
      </div>
    </section>

    <!-- LEVEL SELECT -->
    <section id="screen-levels" class="screen">
      <h2>Levels</h2>
      <div id="level-grid" class="level-grid"></div>
      <button id="btn-levels-back" class="ghost">Back</button>
    </section>

    <!-- GAME -->
    <section id="screen-game" class="screen">
      <header class="hud">
        <button id="btn-menu" class="ghost">Menu</button>
        <div class="hud-info">
          <span id="hud-level">Level 1</span>
          <span>Moves: <b id="hud-moves">0</b></span>
        </div>
        <div class="hud-actions">
          <button id="btn-undo" class="ghost" title="Undo (Z)">Undo</button>
          <button id="btn-restart" class="ghost" title="Restart (R)">Restart</button>
        </div>
      </header>

      <div id="board" class="board" role="application" aria-label="Puzzle board"></div>
      <p id="hint-text" class="hint-text"></p>

      <!-- On-screen controls for touch -->
      <div class="dpad" aria-label="Move controls">
        <button data-dir="up">&#9650;</button>
        <button data-dir="left">&#9664;</button>
        <button data-dir="down">&#9660;</button>
        <button data-dir="right">&#9654;</button>
      </div>

      <div id="win-overlay" class="overlay hidden">
        <div class="card">
          <h2>Level complete</h2>
          <p id="win-stats"></p>
          <div class="stack">
            <button id="btn-next">Next level</button>
            <button id="btn-replay" class="ghost">Replay</button>
          </div>
        </div>
      </div>
    </section>

    <!-- HOW TO PLAY -->
    <section id="screen-how" class="screen">
      <h2>How to play</h2>
      <ul class="how">
        <li>Move with arrow keys, WASD, or the on-screen buttons.</li>
        <li>Reach the goal tile to finish the level.</li>
        <li>Press Z to undo and R to restart.</li>
      </ul>
      <button id="btn-how-back" class="ghost">Back</button>
    </section>

  </main>

  <script src="audio.js"></script>
  <script src="game.js"></script>
</body>
</html>
